<div class="container">
  <div class="container-row">
    <div class="container-fluid">
      <h1 class="title">Iniciar sesión</h1>
      <form class="formulario" [formGroup]="userForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="email">Email:</label>
          <input
            type="email"
            class="form-control"
            id="email"
            formControlName="email"
          />

          <div
            *ngIf="
              userForm.get('email')?.touched && userForm.get('email')?.invalid
            "
          >
            <small
              class="alert"
              *ngIf="userForm.get('email')?.errors?.['required']"
            >
              El correo es requerido
            </small>
            <small
              class="alert"
              *ngIf="userForm.get('email')?.errors?.['email']"
            >
              El correo no es válido
            </small>
          </div>
        </div>
        <div class="form-group">
          <label for="password">Contraseña:</label>
          <input
            [type]="togglepassword ? 'text' : 'password'"
            class="form-control"
            id="password"
            name="password"
            formControlName="password"
          />
          <div
            *ngIf="
              userForm.get('password')?.touched &&
              userForm.get('password')?.invalid
            "
          >
            <small
              class="alert"
              *ngIf="userForm.get('password')?.errors?.['required']"
            >
              La contraseña es requerido
            </small>
            <small
              class="alert"
              *ngIf="userForm.get('password')?.errors?.['minlength']"
            >
              El minimo de caracteres es 8
            </small>
          </div>
        </div>
        <div class="form-check">
          <input
            type="checkbox"
            (click)="CambiarPass()"
            class="form-check-input"
            id="recordarme"
          />
          <label class="form-check-label" for="recordarme">
            {{ togglepassword ? " Ocultar" : " Ver" }} contraseña
          </label>
        </div>

        <!-- Recuperar contraseña -->
        <div class="link-restart">
          <a
            class="session"
            [routerLink]="['/home/reset']"
            routerLinkActive="router-link-active"
          >
            ¿Olvidé su contraseña?
          </a>
        </div>

        <!-- Boton para enviar formulario -->
        <div class="btn-submit">
          <button type="submit" [disabled]="userForm.invalid">
            Iniciar sesión
          </button>
        </div>

        <!-- Loadin -->
        @if (loading) {
        <div class="carger">Loading...</div>
        }
        <!-- muestra error si lo hubo -->
        @if (statusError) {
        <div class="alert-danger" (click)="CerrarAlert()">
          {{ errors }}
        </div>
        }
      </form>
    </div>
  </div>
</div>
