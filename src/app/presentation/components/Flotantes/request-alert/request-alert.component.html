<div class="container">
  <div class="container-fluid">
    <div class="icono" (click)="closeAlert.emit(false)">
        <fa-icon [icon]="faCircleXmark"></fa-icon>
    </div>
    <div class="request">
      {{ Request }}
    </div>
    <div class="responses">
      <div class="btn" (click)="respuesta(true)">Yes</div>
      <div class="btn" (click)="respuesta(false)">Not</div>
    </div>
  </div>
</div>
