<div class="container" (click)="verifica()" [class.delete]="onDelete">

  <div class="container-fluid">

    <!-- contenido de las notas -->
    <div class="title">
      @if (deleteOn) {
      <div class="delete_icon">
        @if (onDelete) {
        <fa-icon [icon]="faCircleCheck" />
        }
      </div>
      }
      
      <h4>
        {{ card.title }}
      </h4>
    </div>
    <section class="content">
      {{ card.contenido }}
    </section>
  </div>
</div>
