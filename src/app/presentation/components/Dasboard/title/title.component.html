<!--Templeate title -->
<div class="container">
  <div class="container-fluid">

    <!-- name of applicattion -->
    <div class="name">
      <h2>MyBloog</h2>
    </div>

    @if (buscar) {
    <div class="panel_buscar" [class.buscar_active]="buscar">

      <div class="consulta">
        <div (click)="onToggleSearch(false)" title="cerrar busqueda" class="salir">
          <fa-icon [icon]="faSquareXmark" />
        </div>
        <form>
          <input class="search" placeholder="Search..." type="text">
          <button value="submit">Buscar</button>
        </form>
      </div>

    </div>
    }

    <!-- actions seargh - logout -->
    <div class="actions">

      <!-- funtions -->
      <div class="funtions">
        <!-- buscar -->
        @if (!buscar) {
        <div (click)="onToggleSearch(true)" title="buscar" class="search">
          <fa-icon [icon]="search" />
        </div>
        }@else {
        <div class="vacio">

        </div>
        }

        <!-- configuraciones -->
        <div (click)="goSetting()" title="configuraions" class="settings">
          <fa-icon [icon]="faGears" />
        </div>
      </div>

      <!-- cerrar sesion -->
      <div title="salir" class="logout" (click)="loguot()">
        <fa-icon [icon]="close" />
      </div>

    </div>
  </div>
</div>
@if (exit) {
<app-logout />
}
