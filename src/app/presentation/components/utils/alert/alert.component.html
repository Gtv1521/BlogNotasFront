<div class="container">
  <div class="salir">

  </div>
  <div class="container-row">
    <div class="container-alarm">
      <div class="icono">
        <i class="fa-solid fa-exclamation-triangle"></i>
      </div>

        {{ title }}

      <h4 class="mensaje">{{ message }}</h4>
      <button class="button-success" (click)="CambiarRuta()">Entendido</button>
    </div>
  </div>
</div>
