<div class="container">
  <div class="container-row">
    <div class="container-column">
      <h1 class="title">Crear usuario</h1>
      <form
        class="formulario"
        [formGroup]="UsuarioForm"
        (ngSubmit)="onSubmit()"
      >
        <!-- Nombre -->
        <div class="form-group">
          <label for="name">Nombre:</label>
          <input
            type="text"
            class="form-control"
            id="nombre"
            formControlName="name"
          />
          <div
            *ngIf="
              UsuarioForm.get('name')?.invalid &&
              UsuarioForm.get('name')?.touched
            "
            class=""
          >
            <small
              class="alert"
              *ngIf="UsuarioForm.get('name')?.errors?.['required']"
            >
              El nombre es requerido
            </small>
            <small
              class="alert"
              *ngIf="UsuarioForm.get('name')?.errors?.['minlength']"
            >
              Es minimo de caracteres es 8
            </small>
          </div>
        </div>

        <!-- Email -->
        <div class="form-group">
          <label for="email">Email:</label>
          <input
            type="email"
            class="form-control"
            id="email"
            formControlName="email"
          />
          <div
            *ngIf="
              UsuarioForm.get('email')?.invalid &&
              UsuarioForm.get('email')?.touched
            "
          >
            <small
              class="alert"
              *ngIf="UsuarioForm.get('email')?.errors?.['required']"
            >
              El email es requerido
            </small>
            <small
              class="alert"
              *ngIf="UsuarioForm.get('email')?.errors?.['email']"
            >
              El email es invalido
            </small>
          </div>
        </div>

        <!-- Contraseña -->
        <div class="form-group">
          <label for="password">Contraseña:</label>
          <input
            [type]="togglepassword ? 'text' : 'password'"
            class="form-control"
            id="password"
            name="password"
            formControlName="password"
          />
          <div
            *ngIf="
              UsuarioForm.get('password')?.touched &&
              UsuarioForm.get('password')?.invalid
            "
          >
            <small
              class="alert"
              *ngIf="UsuarioForm.get('password')?.errors?.['required']"
            >
              La contraseña es requerido
            </small>
            <small
              class="alert"
              *ngIf="UsuarioForm.get('password')?.errors?.['minlength']"
            >
              El minimo de caracteres es 8
            </small>
          </div>
        </div>

        <!-- Confirma la contraseña -->
        <div class="form-group">
          <label for="conf-password">Confirma contraseña:</label>
          <input
            [type]="togglepassword ? 'text' : 'password'"
            class="form-control"
            id="conf-password"
            formControlName="confirmPassword"
          />
          <div
            *ngIf="
              UsuarioForm.get('confirmPassword')?.touched &&
              UsuarioForm.get('confirmPassword')?.invalid
            "
          >
            <small
              class="alert"
              *ngIf="UsuarioForm.get('confirmPassword')?.errors?.['requered']"
            >
              El minimo de caracteres es 8
            </small>
            <div
              class="alert"
              *ngIf="UsuarioForm.get('confirmPassword')?.errors?.['mismatch']"
            >
              Las contraseñas no coinciden.
            </div>
          </div>
        </div>

        <!-- Muestra la contraseña -->
        <div class="form-check">
          <input
            type="checkbox"
            name=""
            (click)="cambiarPass()"
            id="toggle_pass"
          />
          <label for="toggle_pass">
            {{ togglepassword ? ' Ocultar' : ' Ver' }} contraseña
          </label>
        </div>

        <!-- Botón para enviar el formulario -->
        <div class="btn-submit">
          <button
            type="submit"
            class="btn btn-primary"
            [disabled]="UsuarioForm.invalid"
          >
            Crear usuario
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
