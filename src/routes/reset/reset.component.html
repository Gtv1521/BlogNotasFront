<div class="container">
  <div class="container-row">
    <div class="container-column">
      <h1 class="title">Restablecer constraseña</h1>
      <form class="formulario" [formGroup]="Correo" (ngSubmit)="onSubmit()">
        <!-- Correo -->
        <div class="form-group">
          <label for="email">Correo electrónico:</label>
          <input
            type="email"
            class="form-control"
            id="email"
            formControlName="correo"
            placeholder="Ingrese su correo electrónico"
          />
          <div class="" *ngIf="Correo.get('correo')?.invalid && Correo.get('correo')?.touched">
            <small class="alert" *ngIf="Correo.get('correo')?.errors?.['required']">Este campo es obligatorio.</small>
            <small class="alert" *ngIf="Correo.get('correo')?.errors?.['email']">El correo no se encuentra registrado.</small>
          </div>
        </div>

        <!-- Boton para enviar formulario -->
        <div class="btn-submit">
          <button type="submit" class="btn btn-primary">Restablecer</button>
        </div>
      </form>
    </div>
  </div>
</div>
