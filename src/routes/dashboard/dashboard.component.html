<div class="container">
  @if (loader) {
  <app-loader /> } @else if(loader == false) {
  <div class="navbar">
    <div class="title">
      <h3>My Bloog</h3>
    </div>
  </div>

  <div class="container-fluid">
    <div class="books">
      <app-books [id]="id" (getLibreta)="getLibreta($event)" />
      <div class="contents">
        <div class="new">
          <div class="caja" (click)="toggleModal(true)">
            <fa-icon [icon]="faPlus"></fa-icon>
            <p>Nuevo</p>
          </div>
        </div>
        <div class="settings">
          <div class="caja">
            <fa-icon [icon]="faGears"></fa-icon>
            <p>Settings</p>
          </div>
        </div>
      </div>
    </div>

    <div class="notes">
      <app-list-books [idLibreta]="idlibreta"/>
    </div>
  </div>
  }
</div>
@if (modal) {
<app-new-notebook (toggleModal)="toggleModal($event)" />
}
