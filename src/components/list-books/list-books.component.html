<div class="container">
  <!-- title -->
  <div class="title">
    <h4>List Notes</h4>
  </div>

  <!-- List of listbooks -->
  <div class="notebooks">
    @if (loader) {
    <app-loader />
    } @else if (datos.length === 0) {
    <div class="notfound">No hay notas en esta libreta</div>
    }@else {
    <ul>
      @for (item of datos; track item.idNote) {
      <li>
        <app-note
          [card]="item"
          [isActive]="selectedNoteId === item.idNote"
          (noteSelected)="onNoteSelected(item.idNote)"
        />
      </li>
      }
    </ul>
    }
  </div>
</div>
