<div class="container">
  <div class="container-fluid">
    <div class="title">
      <h4>NoteBooks</h4>
    </div>

    <ul class="list-books">
      @for (item of data; track item.idLibreta) {
      <li class="item" (click)="getLibreta.emit(item.idLibreta)">
        <app-target [nombre]="item.nombre" />
      </li>
      }
    </ul>
  </div>
</div>
