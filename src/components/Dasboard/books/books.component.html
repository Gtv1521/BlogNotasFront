<div class="container">
  <div class="container-fluid">
    <div class="title">
      <h4>NoteBooks</h4>
    </div>

    <ul class="list-books">
      @for (item of data; track item.idLibreta) {
      <li>
        <app-target
          [item]="item"
          [isActive]="selectItem === item.idLibreta"
          (noteSelected)="onNoteSelected(item.idLibreta)"
        />
      </li>
      }
    </ul>
  </div>
</div>
